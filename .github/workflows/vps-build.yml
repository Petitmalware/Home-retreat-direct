name: VPS Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BUILD_CACHE: /tmp/hrd-vps-build-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check startup configuration validation
        run: |
          bash -n deploy/start-production.sh
          bash -n deploy/smoke-production.sh
          bash -n deploy/reset-owner-password.sh
          bash -n deploy/complete-store-opening.sh
          docker run --rm --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/deploy,target=/checks,readonly" \
            node:22-bookworm-slim node --test /checks/check-production-config.test.mjs

      - name: Verify private environment resolution with Compose
        run: |
          validation_directory=$(mktemp -d)
          trap 'rm -f -- "$validation_directory/server.env"; rmdir -- "$validation_directory"' EXIT
          node --input-type=module - "$validation_directory/server.env" <<'NODE'
          import {randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const environmentPath = process.argv[2];
          const fields = {
            HRD_ENV_FILE: environmentPath,
            POSTGRES_PASSWORD: randomBytes(32).toString('hex'),
            DATABASE_URL: 'postgresql://hrd:${POSTGRES_PASSWORD}@db:5432/home_retreat_direct',
            DIRECT_DATABASE_URL: 'postgresql://hrd:${POSTGRES_PASSWORD}@db:5432/home_retreat_direct',
            ENCRYPTION_KEY: randomBytes(32).toString('hex'),
            JOB_SECRET: randomBytes(32).toString('hex'),
            APP_ORIGIN: 'https://homeretreatdirect.com',
            DEVELOPMENT_CATALOG: 'false',
            SHOW_DEMO_REVIEWS: 'false',
            LOCAL_MEDIA_ENABLED: 'true',
            EMAIL_DELIVERY_ENABLED: 'false',
            INIT_PRODUCTION_CONFIRMED: 'homeretreatdirect.com',
            SEED_OWNER_EMAIL: 'owner@example.test',
            SEED_OWNER_PASSWORD: randomBytes(32).toString('hex'),
          };
          writeFileSync(environmentPath, Object.entries(fields).map(([key, value]) => `${key}=${value}\n`).join(''), {mode: 0o600});
          NODE
          docker compose --env-file "$validation_directory/server.env" -f deploy/compose.yml -p hrd config --format json |
            docker run --rm -i --network none \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/deploy/check-production-config.mjs,target=/checks/check-production-config.mjs,readonly" \
              node:22-bookworm-slim node /checks/check-production-config.mjs fresh
          node --input-type=module - "$validation_directory/server.env" <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const environmentPath = process.argv[2];
          const shortPassword = 'a'.repeat(11) + '$'.repeat(4);
          writeFileSync(environmentPath, readFileSync(environmentPath, 'utf8')
            .replace(/^SEED_OWNER_PASSWORD=.*$/m, `SEED_OWNER_PASSWORD='${shortPassword}'`), {mode: 0o600});
          NODE
          if checker_errors=$(docker compose --env-file "$validation_directory/server.env" -f deploy/compose.yml -p hrd config --format json |
            docker run --rm -i --network none \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/deploy/check-production-config.mjs,target=/checks/check-production-config.mjs,readonly" \
              node:22-bookworm-slim node /checks/check-production-config.mjs fresh 2>&1); then
            printf '%s\n' 'The runtime password minimum was not enforced.' >&2
            exit 1
          fi
          case "$checker_errors" in
            *SEED_OWNER_PASSWORD*) printf '%s\n' 'Short passwords are rejected after Compose dollar escaping.' ;;
            *) printf '%s\n' 'Unexpected configuration-check failure.' >&2; exit 1 ;;
          esac

      - name: Check domain-specific Nginx templates
        run: |
          nginx_check_directory=$(mktemp -d)
          trap 'rm -rf -- "$nginx_check_directory"' EXIT
          mkdir -p "$nginx_check_directory/live/homeretreatdirect.com"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=homeretreatdirect.com \
            -keyout "$nginx_check_directory/live/homeretreatdirect.com/privkey.pem" \
            -out "$nginx_check_directory/live/homeretreatdirect.com/fullchain.pem" \
            >/dev/null 2>&1
          printf '%s\n' 'ssl_protocols TLSv1.2 TLSv1.3;' > "$nginx_check_directory/options-ssl-nginx.conf"
          for template in nginx-http.conf.example nginx-https.conf.example; do
            docker run --rm --network none --entrypoint nginx \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/deploy/$template,target=/etc/nginx/conf.d/default.conf,readonly" \
              --mount "type=bind,source=$nginx_check_directory,target=/etc/letsencrypt,readonly" \
              nginx:stable-alpine -t
          done

      - name: Prepare BuildKit
        run: |
          docker buildx create --name hrd-vps-ci --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build tools image
        run: |
          docker buildx build \
            --builder hrd-vps-ci \
            --file deploy/Dockerfile \
            --target tools \
            --platform linux/amd64 \
            --tag home-retreat-direct-tools:ci \
            --load \
            --pull \
            --progress plain \
            --cache-to "type=local,dest=${BUILD_CACHE},mode=max" \
            .

      - name: Build runner image
        run: |
          docker buildx build \
            --builder hrd-vps-ci \
            --file deploy/Dockerfile \
            --target runner \
            --platform linux/amd64 \
            --tag home-retreat-direct:ci \
            --load \
            --progress plain \
            --cache-from "type=local,src=${BUILD_CACHE}" \
            --cache-to "type=local,dest=${BUILD_CACHE},mode=max" \
            .

      - name: Test transactional owner password recovery
        run: |
          docker run --rm --network none home-retreat-direct-tools:ci \
            node --test deploy/reset-owner-password.test.mjs

      - name: Validate the complete product catalog
        run: |
          docker run --rm home-retreat-direct-tools:ci \
            node node_modules/tsx/dist/cli.mjs deploy/init-production.ts --check
          docker run --rm --network none home-retreat-direct-tools:ci \
            node node_modules/tsx/dist/cli.mjs deploy/install-christmas.ts --check

      - name: Test policy publication and reviewed checkout
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/tests,target=/app/tests,readonly" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/app,target=/app/app,readonly" \
            home-retreat-direct-tools:ci node node_modules/tsx/dist/cli.mjs --test \
            tests/business-policies.test.ts tests/launch-readiness.test.ts tests/store-opening.test.ts \
            tests/admin-order-guide.test.ts tests/email-content.test.ts tests/order-documents.test.ts tests/email-provider.test.ts tests/email-routing.test.ts \
            tests/seasonal.test.ts tests/seasonal-catalog.test.ts

      - name: Verify production runtime and image processing
        run: |
          docker run --rm home-retreat-direct:ci node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("server.js")) throw new Error("Production server is missing.");
            if (fs.readdirSync(".").some(name => name === ".env" || name.startsWith(".env."))) throw new Error("Environment files were copied into the production image.");
            require("sharp")({create: {width: 1, height: 1, channels: 3, background: "#000000"}}).png().toBuffer()
              .then(() => console.log("Production server and native image processing are ready."))
              .catch(error => { console.error(error.message); process.exitCode = 1; });
          '

      - name: Start production app with a fresh PostgreSQL database
        timeout-minutes: 8
        run: bash deploy/smoke-production.sh
